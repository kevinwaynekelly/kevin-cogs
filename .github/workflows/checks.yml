name: Cog checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install local test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0 php-cli php-xml jq
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Regression tests
        run: python -m pytest -q
      - name: Native Aria process supervision
        run: sudo "$(command -v python)" -m pytest -q tests/test_aria_bridge_install.py -k service_shutdown_terminates_timeout_group
      - name: Aria build from a root-private checkout
        if: matrix.python == '3.11'
        run: |
          chmod 600 tools/aria_bridge/*.py tools/aria_bridge/*-tools.json tools/aria_bridge/entrypoint.sh
          docker build -t aria-bridge-ci tools/aria_bridge
      - name: Dashboard script syntax
        run: node --check dashboardplus/web/app.js
      - name: Dashboard interactions
        run: node tests/dashboard_frontend.js
      - name: Syntax, metadata, and whitespace
        run: |
          python -m compileall -q audioplus communityplus levelplus logplus owoplus settingshub emojistealerplus exportplus backupplus introplus presenceplus coreplus downloaderplus dashboardplus
          python -c "import json, pathlib; [json.loads(p.read_text()) for p in [pathlib.Path('info.json'), *pathlib.Path('.').glob('*/info.json')]]"
          git diff --check
