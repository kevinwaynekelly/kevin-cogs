name: Aria bridge checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y php-cli php-xml jq openssl
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: PHP and shell syntax
        run: |
          for file in tools/aria_bridge/*.php; do php -l "$file"; done
          for file in tools/aria_bridge/*.sh; do bash -n "$file"; done
      - name: Regression tests
        run: python -m pytest -q
      - name: Native process supervision
        run: sudo "$(command -v python)" -m pytest -q tests/test_aria_bridge_install.py -k service_shutdown_terminates_timeout_group
      - name: Whitespace
        run: git diff --check
